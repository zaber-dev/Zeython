[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zeython"
version = "2.0.0"
description = "An async-first, batteries-included MVC framework for Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Md Mahedi Zaman Zaber" },
]
keywords = ["framework", "mvc", "asgi", "web", "async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=0.38",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mysql = ["asyncmy>=0.2.9"]
s3 = ["boto3>=1.34"]
mcp = ["mcp>=1.29,<3"]
ai = ["anthropic>=0.40"]
redis = ["redis>=5.0"]
sentry = ["sentry-sdk>=2.0"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
graphql = ["graphql-core>=3.2"]
saml = ["python3-saml>=1.16"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "mcp>=1.29,<3",
    "anthropic>=0.40",
    "redis>=5.0",
    "sentry-sdk>=2.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "graphql-core>=3.2",
    "python3-saml>=1.16",
]

[project.urls]
Homepage = "https://zeython.zaber.dev/"
Documentation = "https://zeython.zaber.dev/docs/"
Repository = "https://github.com/zaber-dev/Zeython"
Issues = "https://github.com/zaber-dev/Zeython/issues"
Changelog = "https://github.com/zaber-dev/Zeython/blob/main/CHANGELOG.md"

[project.scripts]
zeython = "zeython.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zeython"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "zeython/_docs"

[tool.hatch.build]
include = [
    "src/zeython/**/*.py",
    "src/zeython/py.typed",
    "src/zeython/cli/templates/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Backstop against a hung test (e.g. an async worker loop whose cancellation
# doesn't propagate cleanly) eating unbounded CI minutes -- no test in this
# suite legitimately takes anywhere close to this. thread-based timeout
# because the signal-based default doesn't reliably interrupt every blocking
# async I/O path.
timeout = 60
timeout_method = "thread"
filterwarnings = [
    # starlette.testclient's own httpx2 nudge; zeython.testing.websocket_client()
    # wraps TestClient, but zeython.testing.client() (the primary test helper)
    # uses httpx directly and is unaffected either way.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/zeython/cli/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option()/typer.Argument() defaults are typer's own dependency-injection
# pattern (mirrors fastapi.Depends()), evaluated once at CLI-definition time by
# design -- not the "shared mutable default" bug B008 exists to catch.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^src/zeython/cli/templates/"]
