name: Publish to PyPI

# Fires when a GitHub Release is published -- cut the release from a green
# main first, then publish from it, rather than publishing straight off a
# branch push. workflow_dispatch is there for a manual re-run (e.g. PyPI
# itself was down on the first attempt); the version-matches-tag check below
# only makes sense for an actual release, so it's skipped on a manual run.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A "pypi" deployment environment -- created automatically on first use
    # with no restrictions, but it's the standard place to later add a
    # required-reviewer protection rule (Settings > Environments) without
    # touching this workflow again.
    environment:
      name: pypi
      url: https://pypi.org/project/zeython/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip build twine

      - name: Confirm pyproject.toml's version matches the release tag
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pyproject.toml version ($PACKAGE_VERSION) doesn't match the release tag ($GITHUB_REF_NAME) -- bump one to match before publishing."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify the built distributions (metadata, README rendering)
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
