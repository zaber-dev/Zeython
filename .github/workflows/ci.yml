name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src/zeython

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -v

  scaffold-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Build a local zeython wheel (not on a real index yet, for the Docker step below)
        run: pip wheel . --no-deps -w /tmp/zeython-wheel
      - name: Generate a project and run its test suite
        run: |
          zeython new "CI Smoke Test" --path /tmp/ci-smoke-test
          cd /tmp/ci-smoke-test
          cp .env.example .env
          pip install -e ".[dev]" 2>/dev/null || pip install -e . pytest pytest-asyncio httpx
          python -m alembic revision --autogenerate -m "initial"
          python -m alembic upgrade head
          pytest -v
      - name: Boot the real server and exercise it over HTTP
        run: |
          cd /tmp/ci-smoke-test
          zeython serve --port 8000 --no-reload &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/ && break || sleep 0.5; done
          curl -sf http://127.0.0.1:8000/ | grep -q "CI Smoke Test"
          curl -sf http://127.0.0.1:8000/welcome | grep -q "Rendered by Jinja2"
          REGISTER_STATUS=$(curl -s -o /tmp/register.json -w '%{http_code}' -c /tmp/cookies.txt \
            -X POST http://127.0.0.1:8000/register -H 'Content-Type: application/json' \
            -d '{"name":"Ada","email":"ada@example.com","password":"hunter2"}')
          test "$REGISTER_STATUS" = "201"
          ME_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/cookies.txt http://127.0.0.1:8000/me)
          test "$ME_STATUS" = "200"
          # A session cookie now exists, so every further unsafe request on
          # it needs the matching CSRF header too -- see docs/csrf.md.
          CSRF_TOKEN=$(grep csrf_token /tmp/cookies.txt | awk '{print $NF}')
          test -n "$CSRF_TOKEN"
          echo "upload me" > /tmp/upload.png
          UPLOAD_STATUS=$(curl -s -o /tmp/upload.json -w '%{http_code}' -b /tmp/cookies.txt \
            -H "X-CSRF-Token: $CSRF_TOKEN" -F "file=@/tmp/upload.png" http://127.0.0.1:8000/uploads)
          test "$UPLOAD_STATUS" = "201"
          UPLOAD_URL=$(python3 -c "import json; print(json.load(open('/tmp/upload.json'))['url'])")
          curl -sf "http://127.0.0.1:8000$UPLOAD_URL" | grep -q "upload me"
          POST_JSON=$(curl -s -b /tmp/cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" -X POST http://127.0.0.1:8000/posts \
            -H 'Content-Type: application/json' -d '{"title":"t","body":"b"}')
          POST_ID=$(python3 -c "import json; print(json.loads('''$POST_JSON''')['id'])")
          curl -s -c /tmp/cookies2.txt -X POST http://127.0.0.1:8000/register -H 'Content-Type: application/json' \
            -d '{"name":"Bea","email":"bea@example.com","password":"hunter2"}' -o /dev/null
          CSRF_TOKEN2=$(grep csrf_token /tmp/cookies2.txt | awk '{print $NF}')
          test -n "$CSRF_TOKEN2"
          STRANGER_DELETE_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/cookies2.txt \
            -H "X-CSRF-Token: $CSRF_TOKEN2" -X DELETE "http://127.0.0.1:8000/posts/$POST_ID")
          test "$STRANGER_DELETE_STATUS" = "403"
          OWNER_DELETE=$(curl -s -o /tmp/delete.out -w '%{http_code}' -b /tmp/cookies.txt \
            -H "X-CSRF-Token: $CSRF_TOKEN" -X DELETE "http://127.0.0.1:8000/posts/$POST_ID")
          test "$OWNER_DELETE" = "204"
          test ! -s /tmp/delete.out  # a 204 must have an empty body
          TOKEN_JSON=$(curl -s -X POST http://127.0.0.1:8000/api/token -H 'Content-Type: application/json' \
            -d '{"email":"ada@example.com","password":"hunter2"}')
          TOKEN=$(python3 -c "import json; print(json.loads('''$TOKEN_JSON''')['token'])")
          API_ME_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8000/api/me)
          test "$API_ME_STATUS" = "200"
          NO_TOKEN_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/me)
          test "$NO_TOKEN_STATUS" = "401"
          curl -sf http://127.0.0.1:8000/openapi.json -o /tmp/openapi.json
          python3 -c "import json; spec = json.load(open('/tmp/openapi.json')); assert spec['info']['title'] == 'CI Smoke Test'; assert '/posts' in spec['paths']; assert spec['paths']['/posts']['get']['summary'] == 'List posts'"
          curl -sf http://127.0.0.1:8000/docs | grep -q "swagger-ui"
          curl -sf http://127.0.0.1:8000/up | grep -q '"status":"ok"'
          python3 -c $'import asyncio\nimport websockets\n\nasync def main():\n    async with websockets.connect("ws://127.0.0.1:8000/ws/chat") as alice, websockets.connect("ws://127.0.0.1:8000/ws/chat") as bob:\n        await alice.send("hello from alice")\n        received = await asyncio.wait_for(bob.recv(), timeout=5)\n        assert received == "hello from alice", received\n\nasyncio.run(main())'
      - name: Build and boot the generated project's Docker image
        run: |
          mkdir -p /tmp/ci-smoke-test/_ci_wheels
          cp /tmp/zeython-wheel/*.whl /tmp/ci-smoke-test/_ci_wheels/
          cd /tmp/ci-smoke-test
          docker build --build-arg PIP_FIND_LINKS=_ci_wheels -t ci-smoke-test:latest .
          docker run -d --name ci-smoke-test --env-file .env -p 8001:8000 ci-smoke-test:latest
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/up && break || sleep 1; done
          curl -sf http://127.0.0.1:8001/up | grep -q '"status":"ok"'
          docker logs ci-smoke-test
          docker stop ci-smoke-test
