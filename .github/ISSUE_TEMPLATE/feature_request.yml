name: Feature request
description: Suggest a framework-level addition or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Framework-level additions (new core modules, CLI commands, breaking
        API changes) get discussed here before implementation --
        application-level features belong in your own app, not the
        framework. See [CONTRIBUTING.md](https://github.com/zaber-dev/Zeython/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've already tried.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else -- a link to how Laravel/Django/another framework handles this, for instance.
    validations:
      required: false
