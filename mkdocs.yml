site_name: Zeython Docs
site_description: Zeython — Flask MVC Structure with Modular Service Architecture
site_url: https://zaber-dev.github.io/Zeython/
repo_name: zaber-dev/Zeython
repo_url: https://github.com/zaber-dev/Zeython
site_author: Md Mahedi Zaman Zaber
edit_uri: edit/main/docs/
nav:
  - Overview:
    - Overview: index.md
    - Getting Started: getting-started.md
    - Examples: examples.md
  - Guide:
    - Architecture: architecture.md
    - Configuration: configuration.md
    - Configuration Reference: config-reference.md
    - API & Routes: api.md
  - Services:
    - Web: services/web.md
    - Discord: services/discord.md
  - Models & Database:
    - Models: models.md
    - Database: database.md
  - Advanced:
    - Authentication: authentication.md
    - File Management: file-management.md
    - Vendor Integrations: vendor-integrations.md
    - Error Monitoring: error-monitoring.md
    - Performance: performance.md
    - Deployment: deployment.md
    - Testing: testing.md
    - Troubleshooting: troubleshooting.md
    - Security: security.md
    - FAQ: faq.md
  - For Developers:
    - Developer Setup: developer-setup.md
    - Coding Standards: coding-standards.md
    - Service Development: service-development.md
    - Debugging: debugging.md
  - Migration: migration.md
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: indigo
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zaber-dev/Zeython
  copyright: "© {year} Md Mahedi Zaman Zaber"
plugins:
  - search
  - tags
  - social
