site_name: Zeython Docs
site_description: Zeython — an async-first, batteries-included MVC framework for Python
site_url: https://zeython.zaber.dev/docs/
site_dir: site/docs
repo_name: zaber-dev/Zeython
repo_url: https://github.com/zaber-dev/Zeython
site_author: Md Mahedi Zaman Zaber
edit_uri: edit/main/docs/
nav:
  - Getting Started:
      - Overview: index.md
      - Getting Started: getting-started.md
      - Architecture: architecture.md
  - Tutorial:
      - Overview: tutorial.md
      - "1. Setup": tutorial-1-setup.md
      - "2. Models": tutorial-2-models.md
      - "3. Controllers & Routes": tutorial-3-controllers.md
      - "4. Relationships": tutorial-4-relationships.md
      - "5. Authentication & Authorization": tutorial-5-auth.md
      - "6. Testing": tutorial-6-testing.md
  - The Basics:
      - Database & Migrations: database.md
      - Relationships: relationships.md
      - Validation: validation.md
      - Model Events: model-events.md
      - Factories & Seeders: database-seeding.md
      - Views: views.md
      - Frontend & CSS: frontend.md
  - Security:
      - Authentication: authentication.md
      - CSRF Protection: csrf.md
      - Authorization: authorization.md
      - API Authentication: api-authentication.md
      - Security Headers: security-headers.md
      - Rate Limiting: rate-limiting.md
      - Multi-Tenancy: multi-tenancy.md
  - Building APIs:
      - OpenAPI & API Docs: openapi.md
      - API Standards: api-standards.md
  - Digging Deeper:
      - CLI Reference: cli.md
      - Console Commands: console-commands.md
      - Plugins: plugins.md
      - Localization: localization.md
      - Events: events.md
      - Background Jobs: queues.md
      - Scheduling: scheduling.md
      - WebSockets: websockets.md
      - Mail: mail.md
      - Caching: caching.md
      - Redis (Distributed): redis.md
      - File Storage: storage.md
      - Admin Panel: admin.md
      - AI: ai.md
      - AI Agents: ai-agents.md
  - Testing: testing.md
  - Deployment & Operations:
      - Health Check: health-check.md
      - Observability: observability.md
      - Profiling: profiling.md
      - Error Monitoring: error-monitoring.md
      - Docker: docker.md
      - Production Checklist: production-checklist.md
      - Benchmarks: benchmarks.md
  - API Reference:
      - Overview: reference/index.md
      - Core: reference/core.md
      - Database: reference/database.md
      - Security: reference/security.md
      - HTTP & APIs: reference/http-api.md
      - Jobs & Realtime: reference/jobs-realtime.md
      - Operations: reference/operations.md
      - Extensibility: reference/extensibility.md
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: blue
      accent: indigo
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  homepage: https://zeython.zaber.dev/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zaber-dev/Zeython
  copyright: "© {year} Md Mahedi Zaman Zaber"
plugins:
  - search
  - tags
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            merge_init_into_class: true
            docstring_section_style: table
            show_if_no_docstring: false
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        Zeython is an async-first, batteries-included MVC framework for
        Python: a dependency injection container, an Active-Record-style
        async ORM, session and API-token auth, RBAC authorization, queues,
        WebSockets, and a Laravel-style CLI, built on Starlette and
        SQLAlchemy 2.0.
      sections:
        Getting Started:
          - index.md
          - getting-started.md
          - architecture.md
        Tutorial:
          - tutorial.md
          - tutorial-1-setup.md
          - tutorial-2-models.md
          - tutorial-3-controllers.md
          - tutorial-4-relationships.md
          - tutorial-5-auth.md
          - tutorial-6-testing.md
        The Basics:
          - database.md
          - relationships.md
          - validation.md
          - model-events.md
          - database-seeding.md
          - views.md
          - frontend.md
        Security:
          - authentication.md
          - csrf.md
          - authorization.md
          - api-authentication.md
          - security-headers.md
          - rate-limiting.md
          - multi-tenancy.md
        Building APIs:
          - openapi.md
          - api-standards.md
        Digging Deeper:
          - cli.md
          - console-commands.md
          - plugins.md
          - localization.md
          - events.md
          - queues.md
          - scheduling.md
          - websockets.md
          - mail.md
          - caching.md
          - redis.md
          - storage.md
          - admin.md
          - ai.md
          - ai-agents.md
        Testing:
          - testing.md
        Deployment & Operations:
          - health-check.md
          - observability.md
          - profiling.md
          - error-monitoring.md
          - docker.md
          - production-checklist.md
          - benchmarks.md
        API Reference:
          - reference/index.md
          - reference/core.md
          - reference/database.md
          - reference/security.md
          - reference/http-api.md
          - reference/jobs-realtime.md
          - reference/operations.md
          - reference/extensibility.md
extra_javascript:
  - assets/copy-markdown.js
extra_css:
  - assets/typography.css
  - assets/copy-markdown.css
