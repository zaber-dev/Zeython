services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      # The default DATABASE_URL (sqlite+aiosqlite:///./database.db) lives
      # inside the container -- uncomment to persist it on the host instead
      # of losing it on every `docker compose down`:
      # - ./database.db:/app/database.db

  # Uncomment for Postgres instead of the SQLite default. Set
  # DATABASE_URL=postgresql+asyncpg://zeython:zeython@db:5432/zeython in
  # .env and add `asyncpg` to pyproject.toml's dependencies.
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: zeython
  #     POSTGRES_PASSWORD: zeython
  #     POSTGRES_DB: zeython
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

  # Uncomment for RedisCache/RedisRateLimiter/RedisQueue instead of the
  # in-memory defaults -- see docs/redis.md. Requires
  # `pip install zeython[redis]`.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

  # Uncomment alongside `redis` above and QUEUE_DRIVER=redis in .env -- a
  # durable queue's jobs are processed by a separate, restartable process,
  # not inside `app`. See docs/queues.md.
  # queue-worker:
  #   build: .
  #   command: zeython queue work
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./storage:/app/storage

  # Uncomment if schedule.py defines any recurring tasks -- a container has
  # no host crontab to point `zeython schedule run` at, so this sidecar
  # loop is the equivalent: runs it once a minute, forever. See
  # docs/scheduling.md.
  # scheduler:
  #   build: .
  #   command: sh -c "while true; do zeython schedule run; sleep 60; done"
  #   env_file:
  #     - .env

# volumes:
#   postgres_data:
