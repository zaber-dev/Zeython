[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "{{ project_slug }}"
version = "0.1.0"
description = "A Zeython application."
requires-python = ">=3.11"
dependencies = [
    "zeython>=2.0.0a1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "routes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
